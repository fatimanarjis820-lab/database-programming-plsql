name: Students Table Creation

on:
  push:
    branches: ["main", "sql-hands-on"]

jobs:
  runs-sql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        # No port mapping needed for internal CI access

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install mysql-client -y

      - name: Wait for MySQL to Start
        run: |
          echo "Waiting for MySQL service to start..."
          for i in {1..60}; do
            if mysqladmin ping -hmysql -uroot -proot --silent; then
              echo "MySQL service is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Wait for testdb Database to be Ready
        run: |
          echo "Waiting for testdb database..."
          for i in {1..30}; do
            if mysql -hmysql -uroot -proot -e "USE testdb;" >/dev/null 2>&1; then
              echo "testdb is ready!"
              break
            fi
            echo "Waiting for testdb... ($i)"
            sleep 2
          done

      - name: Run SQL File
        run: |
          mysql -hmysql -uroot -proot testdb < SQL/students.sql
