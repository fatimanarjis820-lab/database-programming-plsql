name: Students Table Creation

on: 
  push: 
    branches: ["main", "sql-hands-on"]

jobs:
  runs-sql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports: 
          - 3306:3306

    steps:
      - name: Get My Code
        uses: actions/checkout@v4
      
      - name: Install MySQL Client
        run: sudo apt-get install mysql-client -y

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to start..."
          until mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES;" >/dev/null 2>&1; do
          sleep 2
          done
          echo "MySQL is ready!"


      - name: Run SQL File
        run: mysql -h 127.0.0.1 -u root -proot < SQL/students.sql