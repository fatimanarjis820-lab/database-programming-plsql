name: Students Table Creation

on:
  push:
    branches: ["main", "sql-hands-on"]

jobs:
  runs-sql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

    steps:
      - name: Get My Code
        uses: actions/checkout@v4

      - name: Install MySQL Client
        run: sudo apt-get install mysql-client -y

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to start..."
          for i in {1..30}; do
            if mysql -h mysql -u root -proot -e "SHOW DATABASES;" >/dev/null 2>&1; then
              echo "MySQL is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not start in time"
          exit 1

      - name: Run SQL File
        run: mysql -h mysql -u root -proot < SQL/students.sql
